<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Penjualan Harian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --ink: #14213d;
    --muted: #5d6b82;
    --line: #d9dfe7;
    --track: #e4e9f0;
    --sales: #14213d;
    --fp: #0f8b8d;
    --comser: #5b4bc4;
    --warn: #b7791f;
    --neg: #c0392b;
    --pos: #1b8a5a;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1522; --panel: #162033; --ink: #eaf0fa; --muted: #93a2bc;
      --line: #263450; --track: #22304a;
      --sales: #8fb4ff; --fp: #4fd1c5; --comser: #a899ff; --warn: #f0b84a; --neg: #ff8a7a; --pos: #5fd3a0;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums; line-height: 1.5;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 14px 20px 20px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  header { margin-bottom: 10px; }
  header > div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; }
  h1 { margin: 0; font-size: clamp(1.05rem, 2.2vw, 1.3rem); font-weight: 800; letter-spacing: -0.01em; }
  .date { color: var(--muted); font-size: .8rem; }
  #board { display: grid; grid-template-columns: repeat(3, 1fr); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  section.metric { padding: 12px 16px 14px; border-top: 4px solid var(--c); min-width: 0; }
  section.metric + section.metric { border-left: 1px solid var(--line); }
  section.metric h2 { margin: 0 0 8px; font-size: .95rem; font-weight: 700; color: var(--c); }
  section.metric .hint { display: none; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .label { font-size: .75rem; color: var(--muted); font-weight: 500; }
  .value { font-size: clamp(1rem, 1.7vw, 1.3rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin: 1px 0 6px; white-space: nowrap; }
  .value small { font-size: .5em; font-weight: 600; color: var(--muted); margin-right: 4px; letter-spacing: 0; }
  .bar { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 99px; transition: width 900ms cubic-bezier(.2,.7,.2,1); }
  .pct { margin-top: 6px; font-size: clamp(1.3rem, 2.6vw, 1.75rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; color: var(--c); }
  button:focus-visible { outline: 3px solid var(--fp); outline-offset: 2px; }
  button { margin-top: 10px; padding: 9px 18px; border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); font: 700 .9rem inherit; font-family: inherit; cursor: pointer; }
  .lower { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; align-items: stretch; flex: 1 1 auto; min-height: 300px; }
  .deptwrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 10px 8px; min-width: 0; display: flex; flex-direction: column; min-height: 340px; }
  .dept-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .dept-head h2 { margin: 0; font-size: .95rem; font-weight: 700; }
  .dept-head .sub { color: var(--muted); font-size: .72rem; }
  .dept-head button { margin: 0; padding: 5px 10px; font-size: .72rem; font-weight: 700; }
  .scroll { overflow: auto; flex: 1 1 0; min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-size: .62rem; line-height: 1.25; }
  th { text-align: right; font-weight: 600; color: var(--muted); padding: 3px 4px; border-bottom: 2px solid var(--line); white-space: nowrap; }
  td { text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 90px; }
  td .code { color: var(--muted); font-weight: 600; margin-right: 3px; }
  tr.total td { font-weight: 800; border-top: 2px solid var(--ink); border-bottom: 0; }
  .neg { color: var(--neg); }
  .pos { color: var(--pos); }
  :root { --sh: 176px; --photo-w: 40%; --photo-fit: cover; }
  .hbtn { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ctl { display: flex; align-items: center; gap: 4px; }
  .dept-head button.ic { padding: 3px 8px; min-width: 28px; }
  .dept-head button.alt { background: var(--track); color: var(--ink); }
  #unit { display: none; }
  .tablemode #unit { display: inline-block; }
  .deptwrap:not(.tablemode) #dept-unit, .deptwrap:not(.tablemode) #staff-unit { display: none; }
  .deptwrap .scroll { display: none; }
  .deptwrap.tablemode .scroll { display: block; }
  .deptwrap.tablemode .vp, .deptwrap.tablemode .ctl { display: none; }
  .vp { overflow: hidden; flex: 1 1 0; min-height: 0; }
  .track { transition: transform 600ms cubic-bezier(.2,.7,.2,1); will-change: transform; }
  .track.nt { transition: none !important; }
  .slide { height: var(--sh); padding: 8px 10px; display: flex; flex-direction: column; justify-content: center; gap: clamp(6px, 1.2vh, 14px); }
  .s-title { font-size: clamp(1.3rem, 2.6vw, 2.2rem); font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .s-title.mid { font-size: clamp(1rem, 1.7vw, 1.4rem); }
  .s-title.long { font-size: clamp(.95rem, 1.5vw, 1.25rem); }
  .s-title .code { color: var(--muted); font-weight: 700; font-size: .55em; }
  .s-title .tag { font-size: .8rem; font-weight: 700; padding: 1px 9px; border-radius: 99px; background: var(--track); color: var(--muted); }
  .sbar { height: 10px; }
  .slide.hasimg { flex-direction: row; align-items: stretch; justify-content: space-between; gap: 16px; }
  .s-main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(6px, 1.2vh, 14px); }
  .slide.hasimg .sgrid { grid-template-columns: repeat(2, 1fr); }
  .slide.hasimg .m .v { font-size: clamp(.95rem, 1.6vw, 1.4rem); }
  .slide.hasimg .m .l { font-size: .85rem; }
  .photo { height: 100%; width: var(--photo-w); object-fit: var(--photo-fit); object-position: center; border: 0; border-radius: 0; background: none; mix-blend-mode: multiply; flex: none; }
  @media (prefers-color-scheme: dark) { .photo { mix-blend-mode: normal; } }
  .sgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 16px; }
  .m .l { font-size: .78rem; color: var(--muted); font-weight: 500; }
  .m .v { font-size: clamp(.9rem, 1.5vw, 1.1rem); font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
  @media (min-height: 700px) and (min-width: 601px) {
    .sgrid { grid-template-columns: repeat(2, 1fr); gap: clamp(8px, 1.6vh, 18px) 24px; }
    .m .l { font-size: .95rem; }
    .m .v { font-size: clamp(1.3rem, 2.3vw, 2rem); }
  }
  @media (max-width: 600px) { .sgrid { grid-template-columns: repeat(2, 1fr); } .slide.hasimg { flex-direction: column; gap: 6px; } .photo { order: -1; height: 80px; width: 110px; align-self: flex-end; } .slide.hasimg .m .v { font-size: 1rem; } }
  @media (prefers-reduced-motion: reduce) { .track { transition: none; } }
  .staff th:first-child, .staff td:first-child { min-width: 0; }
  .staff th:nth-child(2), .staff td:nth-child(2), .staff th:nth-child(3), .staff td:nth-child(3) { text-align: left; }
  table.staff { font-size: .6rem; }
  .staff th { white-space: normal; line-height: 1.15; vertical-align: bottom; padding: 3px 3px; }
  .staff td { white-space: nowrap; padding: 2px 3px; }
  tr.off td { color: var(--muted); }
  @media (max-width: 900px) { .lower { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { #board { grid-template-columns: 1fr; } section.metric + section.metric { border-left: 0; } }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

</main>

<script>
  // Ganti nilai di bawah ini untuk memperbarui dashboard. null = tidak ada data.
  var DATA = {
    "SALES TODAY": 68519594,
    "% TODAY": null,
    "SALES MTD": 327009056,
    "% MTD": 10.24,
    "FP TODAY": 11,
    "% FP TODAY": 2.52,
    "FP MTD": 71,
    "% FP MTD": 16.28,
    "COMSER TODAY": 0,
    "% COMSER TODAY": 0,
    "COMSER MTD": 844144,
    "% COMSER MTD": 5.83
  };

  var GROUPS = [
    { title: "Sales", hint: "Penjualan dalam Rupiah", color: "var(--sales)", rp: true,
      today: ["SALES TODAY", "% TODAY"], mtd: ["SALES MTD", "% MTD"] },
    { title: "FP", hint: "Jumlah FP", color: "var(--fp)", rp: false,
      today: ["FP TODAY", "% FP TODAY"], mtd: ["FP MTD", "% FP MTD"] },
    { title: "Comser", hint: "Comser dalam Rupiah", color: "var(--comser)", rp: true,
      today: ["COMSER TODAY", "% COMSER TODAY"], mtd: ["COMSER MTD", "% COMSER MTD"] }
  ];

  var nf = new Intl.NumberFormat("id-ID");
  var pf = new Intl.NumberFormat("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function col(label, keys, g) {
    var v = DATA[keys[0]], p = DATA[keys[1]];
    if (p == null) p = 0;
    var val = (v == null) ? "—" : (g.rp ? "<small>Rp</small>" : "") + nf.format(v);
    var w = Math.max(0, Math.min(100, p));
    var pct = '<div class="pct">' + pf.format(p) + '%</div>';
    return '<div><div class="label">' + label + '</div><div class="value">' + val +
      '</div><div class="bar" role="img" aria-label="' + label + ' ' + pf.format(p) + ' persen' +
      '"><i data-w="' + w + '"></i></div>' + pct + '</div>';
  }

  function render() {
    var html = "";
    GROUPS.forEach(function (g) {
      html += '<section class="metric" style="--c:' + g.color + '"><h2>' + g.title + '</h2><p class="hint">' + g.hint +
        '</p><div class="cols">' + col("Hari ini", g.today, g) + col("Bulan berjalan (MTD)", g.mtd, g) + '</div></section>';
    });
    document.getElementById("board").innerHTML = html;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        document.querySelectorAll(".bar > i").forEach(function (el) { el.style.width = el.dataset.w + "%"; });
      });
    });
  }

  function num(s) {
    s = String(s).trim();
    if (s === "" || s === "-") return null;
    var isPct = s.indexOf("%") > -1;
    var n = parseFloat(s.replace(/,/g, "").replace("%", ""));
    return isNaN(n) ? null : { n: n, pct: isPct };
  }

  function parsePaste(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (lines.length < 2) throw new Error("Perlu 2 baris: judul dan nilai.");
    var split = function (l) { return l.indexOf("\t") > -1 ? l.split("\t") : l.split(/\s{2,}/); };
    var heads = split(lines[0]).map(function (h) { return h.trim().replace(/\s+/g, " ").toUpperCase(); });
    var vals = split(lines[1]);
    var out = {}, count = 0;
    heads.forEach(function (h, i) {
      if (!(h in DATA)) return;
      var r = num(vals[i] == null ? "" : vals[i]);
      // kolom persen wajib berformat persen; kalau tidak, dianggap kosong
      if (h.charAt(0) === "%") out[h] = (r && r.pct) ? r.n : null;
      else out[h] = (r && !r.pct) ? r.n : null;
      count++;
    });
    if (!count) throw new Error("Judul kolom tidak dikenali.");
    return out;
  }

  function tickClock() {
    var d = new Date(), o = { timeZone: "Asia/Jakarta" };
    var tgl = d.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Jakarta" });
    var jam = d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: "Asia/Jakarta" }).replace(/\./g, ":");
    document.getElementById("date").textContent = tgl + " \u00b7 " + jam + " WIB";
  }
  tickClock(); setInterval(tickClock, 1000);
  render();

  // ---- Sambungan ke Google Sheets ----
  // Tempel tautan CSV hasil "Terbitkan ke web" di antara tanda kutip.
  // Contoh: "https://docs.google.com/spreadsheets/d/e/XXXX/pub?gid=1234925789&single=true&output=csv"
  var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRZyp3J22u9hmEdnLLic2TOWr6Hp-W0sfohspdI5gr2xhNsz7DetQdB3dTrh4kejjEz8RyHMnIeL2U/pub?output=csv";
  var REFRESH_MS = 10 * 60 * 1000; // data dibaca ulang dari Sheets tiap 10 menit

  function parseCsv(t) {
    var rows = [], row = [], f = "", q = false, i, c;
    for (i = 0; i < t.length; i++) {
      c = t.charAt(i);
      if (q) {
        if (c === '"') { if (t.charAt(i + 1) === '"') { f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && t.charAt(i + 1) === "\n") i++;
        row.push(f); rows.push(row); row = []; f = "";
      } else f += c;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    return rows;
  }

  function setSync(text) {
    var el = document.getElementById("sync");
    if (el) el.textContent = text;
  }

  function loadSheet() {
    if (!SHEET_CSV_URL) return;
    fetch(SHEET_CSV_URL, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (t) {
        var rows = parseCsv(t).filter(function (r) { return r.join("").trim(); });
        if (rows.length < 2) throw new Error("Sheet kosong");
        var parsed = parsePaste(rows[0].join("\t") + "\n" + rows[1].join("\t"));
        Object.keys(parsed).forEach(function (k) { DATA[k] = parsed[k]; });
        render();
        setSync("Data dari Google Sheets, " + new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }));
      })
      .catch(function (e) { setSync("Gagal membaca Google Sheets (" + e.message + "). Menampilkan data terakhir."); });
  }

  if (SHEET_CSV_URL) { setSync("Memuat data..."); loadSheet(); setInterval(loadSheet, REFRESH_MS); }

  // ---- Tabel departemen ----
  // Tempel tautan CSV sheet DEPT (Terbitkan ke web, pilih sheet DEPT, format CSV).
  var DEPT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRZyp3J22u9hmEdnLLic2TOWr6Hp-W0sfohspdI5gr2xhNsz7DetQdB3dTrh4kejjEz8RyHMnIeL2U/pub?gid=1239217629&single=true&output=csv";
  var fullNumbers = false;

  // Kolom: kode, nama, target, sales H-1, sales hari ini, % hari ini, sales MTD, % MTD, -/+ %, -/+ nilai
  var DEPT = [
    ["BA", "Sofa & Chair", 316100000, 32876577, 13959640, 4.42, 46836217, 14.82, -2.18, -6900783],

  function makeCarousel(panelId, prefix, ms) {

    c.fit = fit;
    function pos() { track.style.transform = "translateY(-" + (c.i * 100 / (c.n + 1)) + "%)"; }
    function label() { cnt.textContent = (c.n ? (c.i % c.n) + 1 : 0) + " / " + c.n; }
    function snap() { track.classList.add("nt"); pos(); void track.offsetHeight; track.classList.remove("nt"); }
    c.set = function (slides) {
      c.n = slides.length;
      track.innerHTML = slides.concat(slides.slice(0, 1)).join("");

      snap(); label();
    };
    c.go = function (d) {
      if (!c.n) return;
      if (c.i === c.n) { c.i = 0; snap(); }
      if (d < 0 && c.i === 0) { c.i = c.n; snap(); }
      c.i += d; pos(); label();
      if (c.i === c.n) setTimeout(function () { if (c.i === c.n) { c.i = 0; snap(); } }, 750);
    };
    c.play = function () {
      clearInterval(c.timer);
      c.timer = setInterval(function () { if (!c.hold) c.go(1); }, ms);
    };
    panel.addEventListener("mouseenter", function () { c.hold = true; });
    panel.addEventListener("mouseleave", function () { c.hold = false; });
    panel.addEventListener("focusin", function () { c.hold = true; });
    panel.addEventListener("focusout", function () { c.hold = false; });
    document.getElementById(prefix + "-prev").addEventListener("click", function () { c.go(-1); c.play(); });
    document.getElementById(prefix + "-next").addEventListener("click", function () { c.go(1); c.play(); });
    var btn = document.getElementById(prefix + "-mode");
    btn.addEventListener("click", function () {
      var tbl = panel.classList.toggle("tablemode");
      btn.textContent = tbl ? "Satu per satu" : "Tampilkan tabel";
    });
    return c;
  }

  window.cDept = makeCarousel("dept-panel", "dept", SLIDE_MS);
  window.cStaff = makeCarousel("staff-panel", "staff", SLIDE_MS);
  cDept.set(deptSlides()); cStaff.set(staffSlides());
  cDept.fit(); cStaff.fit();
  cDept.play(); cStaff.play();
  if (PHOTO_CSV_URL) { loadPhotos(); setInterval(loadPhotos, REFRESH_MS); }
  if (STAFF_PHOTO_CSV_URL) { loadStaffPhotos(); setInterval(loadStaffPhotos, REFRESH_MS); }

  // ---- Auto refresh halaman ----
  // 1) Cek versi file HTML tiap REFRESH_MS; kalau file di server berubah (mis. setelah update GitHub), halaman reload sendiri.
  // 2) Reload harian jam 05:00 WIB agar tab yang menyala berhari-hari tetap segar.
  var pageSig = null;
  function checkVersion() {
    if (location.protocol === "file:") return;
    fetch(location.href.split("#")[0], { method: "HEAD", cache: "no-store" })
      .then(function (r) {
        var sig = (r.headers.get("etag") || "") + "|" + (r.headers.get("last-modified") || "") + "|" + (r.headers.get("content-length") || "");
        if (sig === "||") return;
        if (pageSig === null) pageSig = sig;
        else if (sig !== pageSig) location.reload();
      })
      .catch(function () { /* offline: coba lagi nanti */ });
  }
  function dailyReload() {
    var p = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
    // performance.now() > 2 menit: cegah reload berulang di menit yang sama
    if (p === "05:00" && performance.now() > 120000) location.reload();
  }
  checkVersion();
  setInterval(checkVersion, REFRESH_MS);
  setInterval(dailyReload, 30000);
</script>
